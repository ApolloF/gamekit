---
# A slice of the Ludusavi manifest (github.com/mtkennerly/ludusavi-manifest, 2026-10-03).
HITMAN 3:
  alias: "Hitman: World of Assassination"
HITMAN World of Assassination:
  alias: "Hitman: World of Assassination"
"Assassin's Creed Odyssey":
  cloud:
    uplay: true
  files:
    "<root>/savegames/<storeUserId>/5059":
      tags:
        - save
      when:
        - store: uplay
    "<root>/savegames/<storeUserId>/5092":
      tags:
        - save
      when:
        - store: steam
        - store: uplay
    "<winDocuments>/Assassin's Creed Odyssey/ACOdyssey.ini":
      tags:
        - config
      when:
        - os: windows
  id:
    lutris: assassins-creed-odyssey
    steamExtra:
      - 937890
      - 937891
      - 937892
  installDir:
    Assassins Creed Odyssey: {}
  steam:
    id: 812140
DiRT 4:
  cloud:
    steam: true
  files:
    "<root>/userdata/<storeUserId>/421020":
      tags:
        - save
      when:
        - os: windows
          store: steam
        - os: linux
          store: steam
    "<winDocuments>/My Games/DiRT 4/hardwaresettings":
      tags:
        - config
      when:
        - os: windows
  id:
    lutris: dirt-4
  installDir:
    DiRT 4: {}
  launch:
    "<base>/DiRT 4.app":
      - when:
          - os: mac
            store: steam
    "<base>/Dirt4.sh":
      - when:
          - bit: 64
            os: linux
            store: steam
    "<base>/dirt4.exe":
      - when:
          - os: windows
            store: steam
  steam:
    id: 421020
Hades:
  cloud:
    epic: true
    steam: true
  files:
    "<home>/Library/Application Support/Supergiant Games/Hades":
      tags:
        - config
        - save
      when:
        - os: mac
    "<winDocuments>/Saved Games/Hades":
      tags:
        - config
        - save
      when:
        - os: windows
    "<winLocalAppData>/Packages/SupergiantGamesLLC.Hades_q53c1yqmx7pha/SystemAppData/wgs":
      tags:
        - config
        - save
      when:
        - os: windows
          store: microsoft
  id:
    lutris: hades
    steamExtra:
      - 1206340
  installDir:
    Hades: {}
  launch:
    "<base>/Game.macOS.app/Contents/MacOS/Game.macOS":
      - arguments: /steampowered /DirectLoadShell=true /DebugMessages=false /DebugKeysEnabled=false /ShowFPS=false /PerfDashWarnings=false /VerboseScriptLogging=false /UnsafeDebugKeysEnabled=false /UseDevSaves=false /UseInternalBugReporter=false /LiveCreateTextures=false
        when:
          - os: mac
            store: steam
    "<base>/x86/Hades.exe":
      - arguments: "/c=..\\ /steampowered /DirectLoadShell=true /DebugMessages=false /DebugKeysEnabled=false /ShowFPS=false /PerfDashWarnings=false /VerboseScriptLogging=false /UnsafeDebugKeysEnabled=false /LiveCreateTextures=false"
        when:
          - bit: 32
            os: windows
            store: steam
        workingDir: "<base>/x86"
  steam:
    id: 1145360
Halls of Torment:
  cloud:
    steam: true
  files:
    "<home>/.local/share/HallsOfTorment/settings.json":
      tags:
        - config
      when:
        - os: linux
    "<root>/userdata/<storeUserId>/2218750/remote":
      tags:
        - save
      when:
        - store: steam
        - os: windows
          store: steam
        - os: linux
          store: steam
    "<winAppData>/HallsOfTorment/settings.json":
      tags:
        - config
      when:
        - os: windows
  id:
    lutris: halls-of-torment
    steamExtra:
      - 2279200
      - 2316660
      - 3386980
      - 3464980
      - 3919420
  installDir:
    Halls of Torment: {}
  launch:
    "<base>/HallsOfTorment.exe":
      - when:
          - os: windows
            store: steam
      - arguments: "--rendering-driver opengl3"
        when:
          - bit: 64
            os: windows
            store: steam
    "<base>/HallsOfTorment.x86_64":
      - when:
          - os: linux
            store: steam
    "<base>/force_gpu.bat":
      - when:
          - bit: 64
            os: windows
            store: steam
  steam:
    id: 2218750
Stardew Valley:
  cloud:
    gog: true
    steam: true
  files:
    "<home>/.config/StardewValley":
      tags:
        - config
      when:
        - os: mac
    "<home>/.config/StardewValley/Saves":
      tags:
        - save
      when:
        - os: mac
    "<winAppData>/StardewValley/Saves":
      tags:
        - save
      when:
        - os: windows
    "<winAppData>/StardewValley/default_options":
      tags:
        - config
      when:
        - os: windows
    "<xdgConfig>/StardewValley":
      tags:
        - config
      when:
        - os: linux
    "<xdgConfig>/StardewValley/Saves":
      tags:
        - save
      when:
        - os: linux
  gog:
    id: 1453375253
  id:
    gogExtra:
      - 1541385446
  installDir:
    Stardew Valley: {}
  launch:
    "<base>/Contents/MacOS/StardewValley":
      - when:
          - os: mac
            store: steam
        workingDir: "<base>/Contents"
    "<base>/Stardew Valley.exe":
      - when:
          - os: windows
            store: steam
    "<base>/StardewValley":
      - arguments: STEAM_RUNTIME=0
        when:
          - os: linux
            store: steam
  steam:
    id: 413150
