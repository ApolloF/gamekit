name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - name: Other platforms build
        shell: bash
        run: GOOS=linux go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Lint (linux)
        shell: bash
        run: GOOS=linux golangci-lint run ./...
      - name: Race detector
        env:
          CGO_ENABLED: 1
        run: go test -race -short ./...
      - name: Vulnerability check
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Fuzz 20 s per target
        shell: bash
        run: |
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=20s ./vdf
          go test -run='^$' -fuzz='^FuzzBare$' -fuzztime=20s ./vdf
          go test -run='^$' -fuzz='^FuzzQuoted$' -fuzztime=20s ./vdf
          go test -run='^$' -fuzz='^FuzzParseBinary$' -fuzztime=20s ./vdf
          go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=20s ./ludusavi
